<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HW シェーダー検査（probe）</title>
<!-- 2026-08-04: 干場のスマホ(Adreno 730)で「生きもの」(mbProg)の つなぎこみが 落ちる。ドライバの ログは 空。
     この 1枚は、実物の シェーダーを 5段階に 分けて その場で つなぎこみ、どの 書き方から 落ちるかを
     画面に 出す 検査ページ。ゲーム本体には いっさい 触らない・読みこまない。役目が 終わったら 消してよい。 -->
<style>
  body{ margin:0; padding:16px; background:#0b1020; color:#eef2ff;
        font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif; }
  h1{ font-size:18px; margin:0 0 4px; }
  p{ color:#9fb0d8; font-size:13px; line-height:1.7; margin:4px 0 14px; }
  .row{ background:#131a33; border-radius:10px; padding:10px 12px; margin:8px 0; }
  .name{ font-size:14px; }
  .ok{ color:#7fe0a0; font-weight:700; }
  .ng{ color:#ff8f8f; font-weight:700; }
  pre{ white-space:pre-wrap; font-size:10px; color:#9fb0d8; margin:6px 0 0; }
  #env{ font-size:11px; color:#9fb0d8; margin-top:14px; word-break:break-all; }
</style>
</head>
<body>
<h1>🔬 HW シェーダー検査</h1>
<p>この画面を そのまま スクリーンショットして おくってください。<br>
（実物の「生きもの」シェーダーを 5段階に 分けて、この端末で つなぎこめるかを 見ています）</p>
<div id="out"></div>
<div id="env"></div>
<script>
(function(){
  var out=document.getElementById("out");
  function row(name, ok, log){
    var d=document.createElement("div"); d.className="row";
    d.innerHTML="<span class='name'>"+name+"</span> … <span class='"+(ok?"ok":"ng")+"'>"+(ok?"つながった":"★落ちた")+"</span>"+
      (log?"<pre>"+String(log).replace(/&/g,"&amp;").replace(/</g,"&lt;")+"</pre>":"");
    out.appendChild(d);
  }
  var canvas=document.createElement("canvas");
  var gl=canvas.getContext("webgl2");
  if(!gl){ row("WebGL2", false, "この端末/ブラウザでは WebGL2 が 取れません"); return; }

  function test(name, vs, fs){
    try{
      function sh(t,src){ var s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
        if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error("コンパイル: "+(gl.getShaderInfoLog(s)||"(ログ空)"));
        return s; }
      var p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs));
      gl.linkProgram(p);
      if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error("リンク: "+(gl.getProgramInfoLog(p)||"(ログ空)"));
      gl.deleteProgram(p);
      row(name, true, "");
    }catch(e){ row(name, false, e.message); }
  }

  var HEAD="#version 300 es\n";
  // ★いろ側は 実物と 同じ 1本を 全段で つかう（変える 相手を 頂点側だけに しぼる）
  var FS=HEAD+"precision highp float; in vec3 v_nrm; in vec3 v_col; in float v_fog; out vec4 o;"+
    "uniform vec4 u_fog; uniform vec3 u_sun; uniform vec3 u_sunc; uniform vec3 u_sky;"+
    "void main(){ vec3 n=normalize(v_nrm);"+
    "vec3 L=normalize(u_sun); float lam=max(dot(n,L),0.0);"+
    "vec3 lit=v_col*(u_sunc*(0.30+0.95*lam) + u_sky*0.40 + vec3(0.30));"+
    "lit=mix(u_fog.rgb, lit, v_fog);"+
    "o=vec4(lit,1.0); }";

  // 段1: 弾27相当（スマホで 動いていた 形）
  var V1=HEAD+"layout(location=0) in vec3 a_pos; layout(location=1) in vec3 a_nrm;"+
    "layout(location=2) in vec3 i_p0; layout(location=3) in vec3 i_p1; layout(location=4) in vec2 i_yaws;"+
    "layout(location=5) in vec3 i_size; layout(location=6) in vec3 i_col;"+
    "uniform mat4 u_vp; uniform vec4 u_fog; uniform float u_alpha;"+
    "out vec3 v_nrm; out vec3 v_col; out float v_fog;"+
    "void main(){ vec3 ctr=mix(i_p0, i_p1, u_alpha);"+
    "float dd=i_yaws.y-i_yaws.x; dd=mod(dd+3.14159265, 6.28318531)-3.14159265;"+
    "float th=i_yaws.x+dd*u_alpha, s=sin(th), c=cos(th);"+
    "vec3 q=a_pos*i_size;"+
    "vec3 wp=vec3(q.x*c+q.z*s, q.y, -q.x*s+q.z*c)+ctr;"+
    "vec3 n=vec3(a_nrm.x*c+a_nrm.z*s, a_nrm.y, -a_nrm.x*s+a_nrm.z*c);"+
    "gl_Position=u_vp*vec4(wp,1.0); float w=max(gl_Position.w,0.001);"+
    "v_fog=exp(-pow(w*u_fog.a, 2.0)); v_nrm=n; v_col=i_col; }";

  // 段2: ＋はばたき/ふり（弾28。鳥は この形で つながっている）
  var V2=HEAD+"layout(location=0) in vec3 a_pos; layout(location=1) in vec3 a_nrm;"+
    "layout(location=2) in vec3 i_p0; layout(location=3) in vec3 i_p1; layout(location=4) in vec2 i_yaws;"+
    "layout(location=5) in vec3 i_size; layout(location=6) in vec3 i_col;"+
    "layout(location=7) in vec3 a_rig;"+
    "uniform mat4 u_vp; uniform vec4 u_fog; uniform float u_alpha; uniform float u_time; uniform float u_anim; uniform float u_vary;"+
    "out vec3 v_nrm; out vec3 v_col; out float v_fog;"+
    "void main(){ vec3 ctr=mix(i_p0, i_p1, u_alpha);"+
    "float dd=i_yaws.y-i_yaws.x; dd=mod(dd+3.14159265, 6.28318531)-3.14159265;"+
    "float th=i_yaws.x+dd*u_alpha, s=sin(th), c=cos(th);"+
    "vec3 q=a_pos*i_size;"+
    "float mv = length(i_p1.xz - i_p0.xz);"+
    "float isLeg = abs(a_rig.x);"+
    "float sw = a_rig.x * u_anim * (0.10 + min(mv,0.6)*0.62) * sin(float(gl_InstanceID)*2.39996*u_vary + u_time*(3.4 + min(mv,0.9)*9.0));"+
    "float py = a_rig.y * i_size.y, pz = a_rig.z * i_size.z * isLeg;"+
    "float cw=cos(sw), sq=sin(sw), dy=q.y-py, dz=q.z-pz;"+
    "q = vec3(q.x, py + dy*cw - dz*sq, pz + dy*sq + dz*cw);"+
    "q.y += a_rig.z*(1.0-isLeg) * u_anim * i_size.y * sin(u_time*1.7 + float(gl_InstanceID)*0.9*u_vary);"+
    "vec3 nl = vec3(a_nrm.x, a_nrm.y*cw - a_nrm.z*sq, a_nrm.y*sq + a_nrm.z*cw);"+
    "vec3 wp=vec3(q.x*c+q.z*s, q.y, -q.x*s+q.z*c)+ctr;"+
    "vec3 n=vec3(nl.x*c+nl.z*s, nl.y, -nl.x*s+nl.z*c);"+
    "gl_Position=u_vp*vec4(wp,1.0); float w=max(gl_Position.w,0.001);"+
    "v_fog=exp(-pow(w*u_fog.a, 2.0)); v_nrm=n; v_col=i_col; }";

  // 共通: 弾31の 芯（つけね属性＋int の 番号計算）。pm だけを 3通りに 差しかえる。
  function v31(pmDecl, pmExpr){
    return HEAD+"layout(location=0) in vec3 a_pos; layout(location=1) in vec3 a_nrm;"+
    "layout(location=2) in vec3 i_p0; layout(location=3) in vec3 i_p1; layout(location=4) in vec2 i_yaws;"+
    "layout(location=5) in vec3 i_size; layout(location=6) in vec3 i_col;"+
    "layout(location=7) in vec3 a_rig;"+
    "layout(location=8) in vec4 a_anch; layout(location=9) in float i_pat;"+
    "uniform mat4 u_vp; uniform vec4 u_fog; uniform float u_alpha; uniform float u_time; uniform float u_anim; uniform float u_vary;"+
    pmDecl+
    "out vec3 v_nrm; out vec3 v_col; out float v_fog;"+
    "void main(){ vec3 ctr=mix(i_p0, i_p1, u_alpha);"+
    "float dd=i_yaws.y-i_yaws.x; dd=mod(dd+3.14159265, 6.28318531)-3.14159265;"+
    "float th=i_yaws.x+dd*u_alpha, s=sin(th), c=cos(th);"+
    "int pk=int(i_pat*u_vary+0.5)*7+int(a_anch.w+0.5);"+
    pmExpr+
    "vec3 lp=a_anch.xyz+(a_pos-a_anch.xyz)*pm.xyz; lp.y+=pm.w;"+
    "vec3 q=lp*i_size;"+
    "float mv = length(i_p1.xz - i_p0.xz);"+
    "float isLeg = abs(a_rig.x);"+
    "float sw = a_rig.x * u_anim * (0.10 + min(mv,0.6)*0.62) * sin(float(gl_InstanceID)*2.39996*u_vary + u_time*(3.4 + min(mv,0.9)*9.0));"+
    "float py = (a_anch.y+(a_rig.y-a_anch.y)*pm.y+pm.w) * i_size.y, pz = (a_anch.z+(a_rig.z-a_anch.z)*pm.z) * i_size.z * isLeg;"+
    "float cw=cos(sw), sq=sin(sw), dy=q.y-py, dz=q.z-pz;"+
    "q = vec3(q.x, py + dy*cw - dz*sq, pz + dy*sq + dz*cw);"+
    "q.y += a_rig.z*(1.0-isLeg) * u_anim * i_size.y * sin(u_time*1.7 + float(gl_InstanceID)*0.9*u_vary);"+
    "vec3 nl = vec3(a_nrm.x, a_nrm.y*cw - a_nrm.z*sq, a_nrm.y*sq + a_nrm.z*cw);"+
    "vec3 wp=vec3(q.x*c+q.z*s, q.y, -q.x*s+q.z*c)+ctr;"+
    "vec3 n=vec3(nl.x*c+nl.z*s, nl.y, -nl.x*s+nl.z*c);"+
    "gl_Position=u_vp*vec4(wp,1.0); float w=max(gl_Position.w,0.001);"+
    "v_fog=exp(-pow(w*u_fog.a, 2.0)); v_nrm=n; v_col=i_col; }";
  }

  test("段1 弾27相当（基準）", V1, FS);
  test("段2 ＋ふり(弾28・鳥と同型)", V2, FS);
  test("段3 ＋つけね属性(弾31・表なし)", v31("", "vec4 pm=vec4(1.0,1.0,1.0,0.0); pk=pk;"), FS);
  test("段4 ＋表u_pat[28]を引く(現行=本体と同じ)", v31("uniform vec4 u_pat[28];", "vec4 pm=u_pat[clamp(pk,0,27)];"), FS);
  test("段5 表をテクスチャで引く(修正案)", v31("uniform sampler2D u_patTex;", "vec4 pm=texelFetch(u_patTex, ivec2(clamp(pk,0,27),0), 0);"), FS);

  var ren=""; try{ var ext=gl.getExtension("WEBGL_debug_renderer_info");
    if(ext) ren=String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL)); }catch(e){}
  document.getElementById("env").textContent=
    (ren?("GPU: "+ren+" / "):"")+
    "限界: 属性"+gl.getParameter(gl.MAX_VERTEX_ATTRIBS)+
    " 頂点u"+gl.getParameter(gl.MAX_VERTEX_UNIFORM_VECTORS)+
    " 橋"+gl.getParameter(gl.MAX_VARYING_VECTORS)+
    " / UA: "+navigator.userAgent;
})();
</script>
</body>
</html>
